# Configuración principal. Si cambias el nombre de la organización o del repositorio,
# actualiza baseURL.
baseURL = "https://escrituracademica-grupolys.github.io/"
title = "Escritura académica · Grupo LyS"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true   # permite HTML dentro de los archivos Markdown (p. ej. <mark>)

[params]
  grupoUrl = "https://www.grupolys.org/"
  proyectosGrupoUrl = "https://www.grupolys.org/proyectos.html"

# ---------- Español (idioma por defecto) ----------
[languages.es]
  label = "Español"
  locale = "es"
  weight = 1
  title = "Escritura académica · Grupo LyS"

  [[languages.es.menus.main]]
    name = "Líneas"
    pageRef = "/lineas"
    weight = 10
  [[languages.es.menus.main]]
    name = "Proyectos"
    pageRef = "/proyectos"
    weight = 20
  [[languages.es.menus.main]]
    name = "Financiación"
    pageRef = "/financiacion"
    weight = 30
  [[languages.es.menus.main]]
    name = "Equipo"
    pageRef = "/equipo"
    weight = 40
  [[languages.es.menus.main]]
    name = "Producción"
    pageRef = "/produccion"
    weight = 50
  [[languages.es.menus.main]]
    name = "Recursos"
    pageRef = "/recursos"
    weight = 60
  [[languages.es.menus.main]]
    name = "Eventos"
    pageRef = "/eventos"
