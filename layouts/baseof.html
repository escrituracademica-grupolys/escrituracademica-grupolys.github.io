<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ with .Params.summary }}<meta name="description" content="{{ . }}">{{ else }}{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}{{ end }}
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <a class="skip" href="#contenido">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="contenido">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
